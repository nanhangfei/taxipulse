# NYC Taxi Lambda-Architecture Platform — full local stack
# Secrets come from .env (git-ignored). Copy .env.example -> .env first.
# Bring up:  make up
x-airflow-common: &airflow-common
  build: ./airflow
  image: taxipulse-airflow:2.9.3
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:${AIRFLOW_PG_PASSWORD}@airflow-postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET}
    # --- OpenLineage: cross-tool lineage emitted to Marquez ---
    AIRFLOW__OPENLINEAGE__TRANSPORT: '{"type":"http","url":"http://marquez:5000","endpoint":"api/v1/lineage"}'
    AIRFLOW__OPENLINEAGE__NAMESPACE: nyc_taxi_platform
    # --- StatsD metrics -> statsd-exporter -> Prometheus ---
    AIRFLOW__METRICS__STATSD_ON: "true"
    AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
    AIRFLOW__METRICS__STATSD_PORT: "9125"
    AIRFLOW__METRICS__STATSD_PREFIX: airflow
    # --- Connections injected from env, never hardcoded in DAGs ---
    AIRFLOW_CONN_SNOWFLAKE_DEFAULT: ${AIRFLOW_CONN_SNOWFLAKE_DEFAULT}
    AIRFLOW_CONN_MINIO_S3: ${AIRFLOW_CONN_MINIO_S3}
    SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL}
    # (providers + dbt/soda are baked into the image — see airflow/Dockerfile)
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./dbt_project:/opt/airflow/dbt_project
    - ./soda:/opt/airflow/soda
    - ./spark_jobs:/opt/airflow/spark_jobs
  depends_on:
    airflow-postgres:
      condition: service_healthy

services:
  # ---------------------------------------------------------------- lake
  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio-data:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      retries: 5

  minio-init:
    image: minio/mc:RELEASE.2024-06-12T14-34-03Z
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD} &&
      mc mb -p local/bronze local/silver local/gold local/quarantine local/checkpoints local/realtime;
      exit 0"

  # ------------------------------------------------------------- streaming
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,CONTROLLER://kafka:29093,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: q1Sh-9_ISia_zwGINzRvyQ
    ports: ["9092:9092"]
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "kafka:29092", "--list"]
      interval: 10s
      retries: 10

  # GAP FIX #2: schema governance — producer/consumer contract lives here
  schema-registry:
    image: confluentinc/cp-schema-registry:7.6.1
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:29092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports: ["8081:8081"]

  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      kafka:
        condition: service_healthy
    command: >
      bash -c "
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic taxi_events --partitions 6 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic taxi_events_dlq --partitions 3 --replication-factor 1 &&
      kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic taxi_events_late --partitions 3 --replication-factor 1"

  replay-producer:
    build: ./producer
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_started
    environment:
      KAFKA_BOOTSTRAP: kafka:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      REPLAY_SPEEDUP: "600"          # 1 real day ≈ 2.4 min
      TLC_PARQUET_PATH: /data/yellow_tripdata_2024-01.parquet
    volumes:
      - ./data:/data:ro
    restart: unless-stopped

  # -------------------------------------------------------------- compute
  spark-master:
    image: bitnamilegacy/spark:3.5.1  # bitnami/ tags were pulled from Docker Hub (Broadcom, 2025); legacy org is a frozen archive
    environment: { SPARK_MODE: master }
    ports: ["8082:8080", "7077:7077"]
  spark-worker:
    image: bitnamilegacy/spark:3.5.1  # bitnami/ tags were pulled from Docker Hub (Broadcom, 2025); legacy org is a frozen archive
    environment:
      SPARK_MODE: worker
      SPARK_MASTER_URL: spark://spark-master:7077
      SPARK_WORKER_MEMORY: 2G
    depends_on: [spark-master]

  flink-jobmanager:
    image: flink:1.19-scala_2.12-java11
    command: jobmanager
    ports: ["8083:8081"]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        state.checkpoints.dir: s3a://checkpoints/flink
        s3.endpoint: http://minio:9000
        s3.path.style.access: "true"
        s3.access-key: ${MINIO_ROOT_USER}
        s3.secret-key: ${MINIO_ROOT_PASSWORD}
        execution.checkpointing.interval: 30s
        execution.checkpointing.mode: EXACTLY_ONCE
  flink-taskmanager:
    image: flink:1.19-scala_2.12-java11
    command: taskmanager
    depends_on: [flink-jobmanager]
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4

  # ---------------------------------------------------------- orchestration
  airflow-postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_PG_PASSWORD}
      POSTGRES_DB: airflow
    volumes: [airflow-pg:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command: -c "airflow db migrate && airflow users create --username admin --password ${AIRFLOW_ADMIN_PASSWORD} --firstname a --lastname d --role Admin --email admin@example.com"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports: ["8080:8080"]
    depends_on: [airflow-init]

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on: [airflow-init]

  # ------------------------------------------------- GAP FIX #4: lineage
  marquez-db:
    image: postgres:15
    environment:
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: ${MARQUEZ_PG_PASSWORD}
      POSTGRES_DB: marquez
  marquez:
    image: marquezproject/marquez:0.47.0
    environment:
      MARQUEZ_CONFIG: /usr/src/app/marquez.yml
      POSTGRES_HOST: marquez-db
      POSTGRES_PORT: 5432
      POSTGRES_DB: marquez
      POSTGRES_USER: marquez
      POSTGRES_PASSWORD: ${MARQUEZ_PG_PASSWORD}
    ports: ["5002:5000"]  # host 5002: macOS AirPlay Receiver squats on 5000
    volumes:
      - ./marquez/marquez.yml:/usr/src/app/marquez.yml:ro
    depends_on: [marquez-db]
  marquez-web:
    image: marquezproject/marquez-web:0.47.0
    environment:
      MARQUEZ_HOST: marquez
      MARQUEZ_PORT: 5000
    ports: ["3000:3000"]
    depends_on: [marquez]

  # ----------------------------------------------- GAP FIX #5: monitoring
  statsd-exporter:
    image: prom/statsd-exporter:v0.26.1
    ports: ["9102:9102"]
  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3001:3000"]
    depends_on: [prometheus]

  # -------------------------------------------- GAP FIX #1 (stretch): Vault
  vault:
    image: hashicorp/vault:1.17
    cap_add: [IPC_LOCK]
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_DEV_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports: ["8200:8200"]

volumes:
  minio-data:
  airflow-pg:
