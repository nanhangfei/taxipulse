version: 2
models:
  - name: fct_trips
    description: One row per valid taxi trip (trip grain).
    columns:
      - name: trip_sk
        tests: [unique, not_null]
      - name: pickup_zone_id
        tests:
          - not_null
          - relationships:
              to: ref('dim_zones')
              field: zone_id
      - name: payment_type
        tests:
          - accepted_values:
              values: [1, 2, 3, 4, 5, 6]
      - name: trip_duration_minutes
        tests: [not_null]

exposures:
  - name: taxi_batch_dashboard
    type: dashboard
    maturity: high
    description: Power BI batch dashboard (Import mode) on marts.
    depends_on: [ref('fct_trips'), ref('dim_zones')]
    owner: {name: Data Eng, email: data@example.com}
